<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 專屬課表管理</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 20px auto; padding: 0 15px; background: #f5f7fa; color: #333; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    h2 { margin-top: 0; font-size: 1.3rem; color: #10b981; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 0.9rem; }
    .time-row { display: flex; gap: 10px; align-items: center; }
    .time-row input { flex: 1; }
    select, input, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 1rem; }
    button { background: #10b981; color: white; border: none; font-weight: bold; margin-top: 18px; cursor: pointer; }
    button:hover { background: #059669; }
    .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    .del-btn { width: auto; background: #ef4444; padding: 5px 10px; margin: 0; font-size: 0.85rem; }
    .badge { background: #d1fae5; color: #065f46; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; margin-right: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📅 新增 ESP32 課表</h2>
    <label>重複頻率 / 星期幾</label>
    <select id="day">
      <option value="7">🔁 每天重複 (Every Day)</option>
      <option value="8">💼 週一至週五 (Mon-Fri)</option>
      <option value="9">🏖️ 只有週末 (Sat-Sun)</option>
      <option value="1">星期一 (Mon)</option>
      <option value="2">星期二 (Tue)</option>
      <option value="3">星期三 (Wed)</option>
      <option value="4">星期四 (Thu)</option>
      <option value="5">星期五 (Fri)</option>
      <option value="6">星期六 (Sat)</option>
      <option value="0">星期日 (Sun)</option>
    </select>

    <label>上課時段 (幾點到幾點)</label>
    <div class="time-row">
      <input type="time" id="start_time" value="08:10">
      <span>～</span>
      <input type="time" id="end_time" value="09:00">
    </div>

    <label>科目或事項名稱 (請輸入英文以利 OLED 顯示)</label>
    <input type="text" id="subject" placeholder="例如: Math, English, Read">
    <button onclick="addClass()">＋ 新增到課表</button>
  </div>

  <div class="card">
    <h2>📋 目前雲端課表清單</h2>
    <div id="list">準備連線中...</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://iawhewgtugllvxrhocau.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlhd2hld2d0dWdsbHZ4cmhvY2F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3MzExNjgsImV4cCI6MjExMDMwNzE2OH0.ruNlWvU0EyXG5zc8XaR1c87d0QjmiTeNwpFUdUspbxo';

    const API_ENDPOINT = `${SUPABASE_URL}/rest/v1/timetable`;
    const HEADERS = {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=representation'
    };

    const dayNames = {
      0: '週日', 1: '週一', 2: '週二', 3: '週三', 4: '週四', 5: '週五', 6: '週六',
      7: '每天', 8: '週一至五', 9: '只有週末'
    };

    async function loadClasses() {
      const listDiv = document.getElementById('list');
      listDiv.innerText = '正在向 Supabase 讀取資料...';
      try {
        const res = await fetch(`${API_ENDPOINT}?select=*&order=day_of_week.desc,start_time.asc`, {
          method: 'GET',
          headers: HEADERS
        });
        
        if (!res.ok) {
          const errText = await res.text();
          listDiv.innerHTML = `<span style="color:red;">讀取失敗 (${res.status})：${errText}</span>`;
          return;
        }

        const data = await res.json();
        if (data.length === 0) {
          listDiv.innerText = '連線成功！目前還沒有任何課程，請從上方新增。';
          return;
        }

        listDiv.innerHTML = data.map(row => `
          <div class="item">
            <span>
              <span class="badge">${dayNames[row.day_of_week] || '自訂'}</span>
              <strong>${row.start_time}~${row.end_time || ''}</strong> ${row.subject}
            </span>
            <button class="del-btn" onclick="deleteClass(${row.id})">刪除</button>
          </div>
        `).join('');
      } catch (err) {
        listDiv.innerHTML = `<span style="color:red;">連線錯誤：${err.message}</span>`;
      }
    }

    async function addClass() {
      const day_of_week = parseInt(document.getElementById('day').value);
      const start_time = document.getElementById('start_time').value;
      const end_time = document.getElementById('end_time').value;
      const subject = document.getElementById('subject').value.trim();
      
      if (!start_time || !end_time || !subject) return alert('請完整填寫開始時間、結束時間與科目！');
      if (start_time >= end_time) return alert('結束時間必須晚於開始時間喔！');

      try {
        const res = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: HEADERS,
          body: JSON.stringify({ day_of_week, start_time, end_time, subject })
        });
        if (!res.ok) {
          const errText = await res.text();
          alert(`新增失敗 (${res.status})：${errText}`);
        } else {
          document.getElementById('subject').value = '';
          loadClasses();
        }
      } catch (err) {
        alert('新增發生錯誤：' + err.message);
      }
    }

    async function deleteClass(id) {
      await fetch(`${API_ENDPOINT}?id=eq.${id}`, {
        method: 'DELETE',
        headers: HEADERS
      });
      loadClasses();
    }

    loadClasses();
  </script>
</body>
</html>
