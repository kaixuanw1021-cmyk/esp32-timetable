<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 專屬課表管理</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 20px auto; padding: 0 15px; background: #f5f7fa; color: #333; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    h2 { margin-top: 0; font-size: 1.25rem; color: #10b981; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 0.9rem; }
    .time-row { display: flex; gap: 10px; align-items: center; }
    .time-row input { flex: 1; }
    select, input, button { width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 1rem; }
    button { background: #10b981; color: white; border: none; font-weight: bold; margin-top: 14px; cursor: pointer; }
    button:disabled { background: #9ca3af; }
    .btn-blue { background: #3b82f6; }
    .btn-outline { background: transparent; color: #555; border: 1px solid #ccc; margin-top: 8px; }
    .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    .del-btn { width: auto; background: #ef4444; padding: 5px 10px; margin: 0; font-size: 0.85rem; }
    .badge { background: #d1fae5; color: #065f46; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; margin-right: 4px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.85rem; color: #666; }
    .key-box { background: #fef3c7; border: 1px solid #f59e0b; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem; }
    .key-saved { background: #ecfdf5; border: 1px solid #10b981; padding: 8px 12px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem; display: flex; justify-content: space-between; color: #065f46; }
  </style>
</head>
<body>
  <div id="key-setup" class="key-box">
    <strong>首次使用請貼上 Supabase anon public 金鑰：</strong>
    <input type="text" id="api-key-input" placeholder="貼上金鑰">
    <button type="button" onclick="saveKey()">儲存並記住金鑰</button>
  </div>
  <div id="key-saved-bar" class="key-saved" style="display:none;">
    <span>已自動載入 API 金鑰</span>
    <a href="#" onclick="resetKey()">更換金鑰</a>
  </div>
  <div id="auth-section" class="card">
    <h2>課表管理系統登入</h2>
    <form onsubmit="event.preventDefault(); loginWithPassword();">
      <label>電子信箱 (Email)</label>
      <input type="email" id="email" autocomplete="username" required>
      <label>密碼</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit" id="btn-login">密碼登入</button>
    </form>
    <button type="button" id="btn-magic" class="btn-blue" onclick="sendMagicLink()">寄送免密碼登入連結</button>
    <button type="button" id="btn-forgot" class="btn-outline" onclick="forgotPassword()">忘記密碼？寄送重設連結</button>
  </div>
  <div id="password-section" class="card" style="display:none;">
    <h2>設定新密碼</h2>
    <input type="password" id="new-password" placeholder="輸入新密碼 (至少6碼)">
    <button type="button" id="btn-update-pw" onclick="updatePassword()">確認更新密碼</button>
    <button type="button" class="btn-outline" onclick="showView('app')">取消返回</button>
  </div>
  <div id="app-section" style="display:none;">
    <div class="top-bar">
      <span id="user-email">已登入</span>
      <div>
        <a href="#" onclick="showView('password')" style="color:#3b82f6; margin-right:12px;">修改密碼</a>
        <a href="#" onclick="logout()" style="color:#ef4444;">登出</a>
      </div>
    </div>
    <div class="card">
      <h2>新增 ESP32 課表</h2>
      <select id="day">
        <option value="7">每天重複</option>
        <option value="8">週一至週五</option>
        <option value="9">只有週末</option>
        <option value="1">星期一</option>
        <option value="2">星期二</option>
        <option value="3">星期三</option>
        <option value="4">星期四</option>
        <option value="5">星期五</option>
        <option value="6">星期六</option>
        <option value="0">星期日</option>
      </select>
      <div class="time-row">
        <input type="time" id="start_time" value="08:10">
        <span>～</span>
        <input type="time" id="end_time" value="09:00">
      </div>
      <input type="text" id="subject" placeholder="英文科目 (如 Math, English)">
      <button type="button" id="btn-add" onclick="addClass()">＋ 新增到課表</button>
    </div>
    <div class="card">
      <h2>目前雲端課表清單</h2>
      <div id="list">載入中...</div>
    </div>
    <div class="card">
      <h2>新增使用者帳號</h2>
      <input type="email" id="new-user-email" placeholder="新使用者 Email">
      <input type="password" id="new-user-password" placeholder="設定密碼 (至少6碼)">
      <button type="button" id="btn-create-user" class="btn-blue" onclick="createNewUser()">＋ 建立新使用者帳號</button>
    </div>
  </div>
  <script>
    var SUPABASE_URL = 'https://iawhewgtugllvxrhocau.supabase.co';
    var DEFAULT_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlhd2hld2d0dWdsbHZ4cmhvY2F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3MzExNjgsImV4cCI6MjExMDMwNzE2OH0.ruNlWvU0EyXG5zc8XaR1c87d0QjmiTeNwpFUdUspbxo';
    var SUPABASE_KEY = DEFAULT_ANON_KEY || localStorage.getItem('sb_anon_key') || '';
    var accessToken = localStorage.getItem('sb_access_token') || '';
    var userEmail = localStorage.getItem('sb_user_email') || '';
    var dayNames = { 0: '週日', 1: '週一', 2: '週二', 3: '週三', 4: '週四', 5: '週五', 6: '週六', 7: '每天', 8: '週一至五', 9: '只有週末' };

    function updateKeyUI() {
      document.getElementById('key-setup').style.display = SUPABASE_KEY ? 'none' : 'block';
      document.getElementById('key-saved-bar').style.display = (!DEFAULT_ANON_KEY && SUPABASE_KEY) ? 'flex' : 'none';
    }
    function saveKey() {
      var k = document.getElementById('api-key-input').value.trim();
      if (!k) return alert('請貼上金鑰');
      SUPABASE_KEY = k; localStorage.setItem('sb_anon_key', k); updateKeyUI();
    }
    function resetKey() { SUPABASE_KEY = ''; localStorage.removeItem('sb_anon_key'); updateKeyUI(); }
    function showView(v) {
      document.getElementById('auth-section').style.display = (v === 'auth') ? 'block' : 'none';
      document.getElementById('password-section').style.display = (v === 'password') ? 'block' : 'none';
      document.getElementById('app-section').style.display = (v === 'app') ? 'block' : 'none';
      if (v === 'app') { document.getElementById('user-email').innerText = userEmail; loadClasses(); }
    }
    async function authReq(path, body, token) {
      var h = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' };
      if (token) h['Authorization'] = 'Bearer ' + token;
      var res = await fetch(SUPABASE_URL + path, { method: token && path.indexOf('user') !== -1 ? 'PUT' : 'POST', headers: h, body: JSON.stringify(body) });
      var data = await res.json().catch(function(){ return {}; });
      if (!res.ok) throw new Error(data.error_description || data.msg || '操作失敗');
      return data;
    }
    async function loginWithPassword() {
      try {
        var d = await authReq('/auth/v1/token?grant_type=password', { email: document.getElementById('email').value.trim(), password: document.getElementById('password').value });
        accessToken = d.access_token; userEmail = d.user.email;
        localStorage.setItem('sb_access_token', accessToken); localStorage.setItem('sb_user_email', userEmail);
        showView('app');
      } catch (e) { alert(e.message); }
    }
    async function sendMagicLink() {
      try {
        await authReq('/auth/v1/magiclink', { email: document.getElementById('email').value.trim(), redirect_to: window.location.origin });
        alert('免密碼連結已寄出，請查看信箱！');
      } catch (e) { alert(e.message); }
    }
    async function forgotPassword() {
      try {
        await authReq('/auth/v1/recover', { email: document.getElementById('email').value.trim(), redirect_to: window.location.origin });
        alert('重設密碼信已寄出，請查看信箱！');
      } catch (e) { alert(e.message); }
    }
    async function updatePassword() {
      try {
        await authReq('/auth/v1/user', { password: document.getElementById('new-password').value }, accessToken);
        alert('密碼已更新！'); showView('app');
      } catch (e) { alert(e.message); }
    }
    async function createNewUser() {
      try {
        var em = document.getElementById('new-user-email').value.trim();
        await authReq('/auth/v1/signup', { email: em, password: document.getElementById('new-user-password').value });
        alert('新使用者 ' + em + ' 建立成功！');
        document.getElementById('new-user-email').value = ''; document.getElementById('new-user-password').value = '';
      } catch (e) { alert('建立失敗：' + e.message); }
    }
    function logout() { accessToken = ''; userEmail = ''; localStorage.removeItem('sb_access_token'); showView('auth'); }
    async function loadClasses() {
      var listDiv = document.getElementById('list');
      var res = await fetch(SUPABASE_URL + '/rest/v1/timetable?select=*&order=day_of_week.desc,start_time.asc', { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + accessToken } });
      if (res.status === 401) return logout();
      var data = await res.json();
      listDiv.innerHTML = data.length ? data.map(function(r) {
        return '<div class="item"><span><span class="badge">' + (dayNames[r.day_of_week] || '') + '</span><strong>' + r.start_time + '~' + (r.end_time || '') + '</strong> ' + r.subject + '</span><button type="button" class="del-btn" onclick="deleteClass(' + r.id + ')">刪除</button></div>';
      }).join('') : '目前沒有課程';
    }
    async function addClass() {
      var res = await fetch(SUPABASE_URL + '/rest/v1/timetable', {
        method: 'POST', headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
        body: JSON.stringify({ day_of_week: parseInt(document.getElementById('day').value), start_time: document.getElementById('start_time').value, end_time: document.getElementById('end_time').value, subject: document.getElementById('subject').value.trim() })
      });
      if (res.ok) { document.getElementById('subject').value = ''; loadClasses(); } else alert('新增失敗');
    }
    async function deleteClass(id) {
      await fetch(SUPABASE_URL + '/rest/v1/timetable?id=eq.' + id, { method: 'DELETE', headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + accessToken } });
      loadClasses();
    }
    updateKeyUI();
    var h = window.location.hash;
    if (h && (h.indexOf('type=recovery') !== -1 || h.indexOf('type=magiclink') !== -1)) {
      var t = new URLSearchParams(h.substring(1)).get('access_token');
      if (t) { accessToken = t; localStorage.setItem('sb_access_token', t); window.history.replaceState(null, null, window.location.pathname); showView(h.indexOf('type=recovery') !== -1 ? 'password' : 'app'); }
    } else { showView(accessToken ? 'app' : 'auth'); }
  </script>
</body>
</html>
