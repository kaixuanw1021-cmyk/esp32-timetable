<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 專屬課表管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 480px; margin: 20px auto; padding: 0 15px; background: #f5f7fa; color: #333; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    .setup-card { background: #fffbeb; border: 1px solid #fcd34d; }
    h2 { margin-top: 0; font-size: 1.25rem; color: #10b981; }
    .setup-card h2 { color: #b45309; font-size: 1.1rem; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 0.9rem; }
    .time-row { display: flex; gap: 10px; align-items: center; }
    .time-row input { flex: 1; }
    select, input, button { width: 100%; padding: 11px; margin-top: 6px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 1rem; }
    button { background: #10b981; color: white; border: none; font-weight: bold; margin-top: 14px; cursor: pointer; }
    button:hover { background: #059669; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .btn-magic { background: #3b82f6; }
    .btn-magic:hover { background: #2563eb; }
    .btn-warn { background: #d97706; }
    .btn-warn:hover { background: #b45309; }
    .btn-outline { background: transparent; color: #555; border: 1px solid #ccc; margin-top: 8px; }
    .btn-outline:hover { background: #f0f0f0; }
    .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    .del-btn { width: auto; background: #ef4444; padding: 5px 10px; margin: 0; font-size: 0.85rem; }
    .badge { background: #d1fae5; color: #065f46; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; margin-right: 4px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.85rem; color: #666; }
    .divider { text-align: center; margin: 14px 0 6px; font-size: 0.85rem; color: #888; }
    .hint { font-size: 0.82rem; color: #666; margin-top: 6px; line-height: 1.4; }
  </style>
</head>
<body>

  <div id="setup-section" class="card setup-card">
    <h2>⚙️ 首次設定：貼上 Supabase API Key</h2>
    <p class="hint">已自動帶入專案網址，請貼上你的 <strong>anon public key</strong>（只需設定一次，會儲存在本機瀏覽器）：</p>
    <input type="text" id="api-key-input" placeholder="貼上 eyJ... 或 sb_publishable_... 金鑰">
    <button class="btn-warn" onclick="saveApiKey()">儲存金鑰並繼續</button>
  </div>

  <div id="auth-section" class="card" style="display:none;">
    <h2>🔐 課表管理系統登入</h2>
    <form onsubmit="event.preventDefault(); loginWithPassword();">
      <label for="email">電子信箱 (Email)</label>
      <input type="email" id="email" name="username" autocomplete="username" placeholder="請輸入管理員信箱" required>
      
      <label for="password">密碼（支援手機指紋 / Face ID 自動填入）</label>
      <input type="password" id="password" name="password" autocomplete="current-password" placeholder="請輸入密碼">
      
      <button type="submit" id="btn-login">密碼登入</button>
    </form>

    <div class="divider">── 或使用免密碼信箱登入 ──</div>
    <button type="button" id="btn-magic" class="btn-magic" onclick="sendMagicLink()">✨ 寄送免密碼登入連結 (Magic Link)</button>
    <button type="button" id="btn-forgot" class="btn-outline" onclick="forgotPassword()">忘記密碼？寄送重設連結</button>
    <button type="button" class="btn-outline" style="font-size:0.85rem;" onclick="resetApiKey()">重新設定 Supabase API Key</button>
  </div>

  <div id="password-section" class="card" style="display:none;">
    <h2>🔑 設定新密碼</h2>
    <form onsubmit="event.preventDefault(); updatePassword();">
      <label for="new-password">輸入新密碼 (至少 6 個字元)</label>
      <input type="password" id="new-password" autocomplete="new-password" placeholder="請輸入新密碼" required>
      <button type="submit" id="btn-update-pw">確認更新密碼</button>
      <button type="button" class="btn-outline" onclick="showView('app')">取消返回</button>
    </form>
  </div>

  <div id="app-section" style="display:none;">
    <div class="top-bar">
      <span id="user-email">已登入</span>
      <div>
        <a href="#" onclick="showView('password'); return false;" style="color:#3b82f6; margin-right:12px;">修改密碼</a>
        <a href="#" onclick="logout(); return false;" style="color:#ef4444;">登出</a>
      </div>
    </div>

    <div class="card">
      <h2>📅 新增 ESP32 課表</h2>
      <label for="day">重複頻率 / 星期幾</label>
      <select id="day">
        <option value="7">🔁 每天重複 (Every Day)</option>
        <option value="8">💼 週一至週五 (Mon-Fri)</option>
        <option value="9">🏖️ 只有週末 (Sat-Sun)</option>
        <option value="1">星期一 (Mon)</option>
        <option value="2">星期二 (Tue)</option>
        <option value="3">星期三 (Wed)</option>
        <option value="4">星期四 (Thu)</option>
        <option value="5">星期五 (Fri)</option>
        <option value="6">星期六 (Sat)</option>
        <option value="0">星期日 (Sun)</option>
      </select>

      <label>上課時段 (幾點到幾點)</label>
      <div class="time-row">
        <input type="time" id="start_time" value="08:10">
        <span>～</span>
        <input type="time" id="end_time" value="09:00">
      </div>

      <label for="subject">科目或事項名稱 (英文)</label>
      <input type="text" id="subject" placeholder="例如: Math, English, Read">
      <button type="button" id="btn-add" onclick="addClass()">＋ 新增到課表</button>
    </div>

    <div class="card">
      <h2>📋 目前雲端課表清單</h2>
      <div id="list">載入中...</div>
    </div>
  </div>

  <script>
    var SUPABASE_URL = 'https://iawhewgtugllvxrhocau.supabase.co';
    var supabaseKey = localStorage.getItem('sb_anon_key') || '';
    var accessToken = localStorage.getItem('sb_access_token') || '';
    var userEmail = localStorage.getItem('sb_user_email') || '';

    var dayNames = {
      0: '週日', 1: '週一', 2: '週二', 3: '週三', 4: '週四', 5: '週五', 6: '週六',
      7: '每天', 8: '週一至五', 9: '只有週末'
    };

    function showView(v) {
      document.getElementById('setup-section').style.display = (v === 'setup') ? 'block' : 'none';
      document.getElementById('auth-section').style.display = (v === 'auth') ? 'block' : 'none';
      document.getElementById('password-section').style.display = (v === 'password') ? 'block' : 'none';
      document.getElementById('app-section').style.display = (v === 'app') ? 'block' : 'none';
      if (v === 'app') {
        document.getElementById('user-email').innerText = userEmail || '已登入';
        loadClasses();
      }
    }

    function saveApiKey() {
      var val = document.getElementById('api-key-input').value.trim();
      if (!val) return alert('請貼上你的 Supabase anon public key！');
      supabaseKey = val;
      localStorage.setItem('sb_anon_key', supabaseKey);
      showView('auth');
    }

    function resetApiKey() {
      localStorage.removeItem('sb_anon_key');
      supabaseKey = '';
      document.getElementById('api-key-input').value = '';
      showView('setup');
    }

    async function loginWithPassword() {
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      if (!email || !password) return alert('請輸入信箱與密碼！');

      var btn = document.getElementById('btn-login');
      btn.disabled = true; btn.innerText = '登入驗證中...';

      try {
        var res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
          method: 'POST',
          headers: { 'apikey': supabaseKey, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error_description || data.msg || '帳號或密碼錯誤');

        accessToken = data.access_token;
        userEmail = data.user.email;
        localStorage.setItem('sb_access_token', accessToken);
        localStorage.setItem('sb_user_email', userEmail);
        showView('app');
      } catch (err) {
        alert('登入失敗：' + err.message);
      } finally {
        btn.disabled = false; btn.innerText = '密碼登入';
      }
    }

    async function sendMagicLink() {
      var email = document.getElementById('email').value.trim();
      if (!email) return alert('請先在上方輸入你的電子信箱！');

      var btn = document.getElementById('btn-magic');
      btn.disabled = true; btn.innerText = '寄送免密碼連結中...';

      try {
        var res = await fetch(SUPABASE_URL + '/auth/v1/otp', {
          method: 'POST',
          headers: { 'apikey': supabaseKey, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, create_user: false, options: { emailRedirectTo: window.location.origin } })
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.msg || data.error_description || '寄送失敗，請確認信箱是否已在後台建立');
        alert('免密碼登入信已寄出！請打開信箱點擊登入連結即可自動進入系統。');
      } catch (err) {
        alert('寄送失敗：' + err.message);
      } finally {
        btn.disabled = false; btn.innerText = '✨ 寄送免密碼登入連結 (Magic Link)';
      }
    }

    async function forgotPassword() {
      var email = document.getElementById('email').value.trim();
      if (!email) return alert('請先在上方輸入你的電子信箱！');

      var btn = document.getElementById('btn-forgot');
      btn.disabled = true; btn.innerText = '寄送重設信中...';

      try {
        var res = await fetch(SUPABASE_URL + '/auth/v1/recover', {
          method: 'POST',
          headers: { 'apikey': supabaseKey, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, redirect_to: window.location.origin })
        });
        if (!res.ok) {
          var data = await res.json();
          throw new Error(data.msg || '寄送失敗');
        }
        alert('重設密碼信件已寄出！請打開信箱點擊連結設定新密碼。');
      } catch (err) {
        alert('寄送失敗：' + err.message);
      } finally {
        btn.disabled = false; btn.innerText = '忘記密碼？寄送重設連結';
      }
    }

    async function updatePassword() {
      var newPassword = document.getElementById('new-password').value;
      if (newPassword.length < 6) return alert('新密碼至少需要 6 個字元！');

      var btn = document.getElementById('btn-update-pw');
      btn.disabled = true; btn.innerText = '更新密碼中...';

      try {
        var res = await fetch(SUPABASE_URL + '/auth/v1/user', {
          method: 'PUT',
          headers: { 'apikey': supabaseKey, 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: newPassword })
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.msg || '更新失敗，請重新登入後再試');

        alert('密碼已成功更新！');
        document.getElementById('new-password').value = '';
        showView('app');
      } catch (err) {
        alert('更新失敗：' + err.message);
      } finally {
        btn.disabled = false; btn.innerText = '確認更新密碼';
      }
    }

    function logout() {
      accessToken = '';
      userEmail = '';
      localStorage.removeItem('sb_access_token');
      localStorage.removeItem('sb_user_email');
      showView('auth');
    }

    async function loadClasses() {
      var listDiv = document.getElementById('list');
      listDiv.innerText = '讀取中...';
      try {
        var res = await fetch(SUPABASE_URL + '/rest/v1/timetable?select=*&order=day_of_week.desc,start_time.asc', {
          headers: { 'apikey': supabaseKey, 'Authorization': 'Bearer ' + accessToken }
        });
        if (res.status === 401) return logout();
        var data = await res.json();
        if (!data || data.length === 0) { listDiv.innerText = '目前還沒有任何課程。'; return; }

        listDiv.innerHTML = data.map(function(row) {
          var dayLabel = dayNames[row.day_of_week] || '自訂';
          var endTime = row.end_time || '';
          return '<div class="item"><span><span class="badge">' + dayLabel + '</span><strong>' + row.start_time + '~' + endTime + '</strong> ' + row.subject + '</span><button class="del-btn" onclick="deleteClass(' + row.id + ')">刪除</button></div>';
        }).join('');
      } catch (err) {
        listDiv.innerText = '讀取異常：' + err.message;
      }
    }

    async function addClass() {
      var day_of_week = parseInt(document.getElementById('day').value);
      var start_time = document.getElementById('start_time').value;
      var end_time = document.getElementById('end_time').value;
      var subject = document.getElementById('subject').value.trim();
      if (!start_time || !end_time || !subject) return alert('請完整填寫時間與科目！');
      if (start_time >= end_time) return alert('結束時間必須晚於開始時間！');

      var btn = document.getElementById('btn-add');
      btn.disabled = true; btn.innerText = '新增中...';

      try {
        var res = await fetch(SUPABASE_URL + '/rest/v1/timetable', {
          method: 'POST',
          headers: { 'apikey': supabaseKey, 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
          body: JSON.stringify({ day_of_week: day_of_week, start_time: start_time, end_time: end_time, subject: subject })
        });
        if (!res.ok) {
          var err = await res.json();
          throw new Error(err.message || '無寫入權限，請檢查 RLS 設定');
        }
        document.getElementById('subject').value = '';
        loadClasses();
      } catch (err) {
        alert('新增失敗：' + err.message);
      } finally {
        btn.disabled = false; btn.innerText = '＋ 新增到課表';
      }
    }

    async function deleteClass(id) {
      await fetch(SUPABASE_URL + '/rest/v1/timetable?id=eq.' + id, {
        method: 'DELETE',
        headers: { 'apikey': supabaseKey, 'Authorization': 'Bearer ' + accessToken }
      });
      loadClasses();
    }

    function initApp() {
      if (!supabaseKey) {
        showView('setup');
        return;
      }
      var hash = window.location.hash;
      if (hash && hash.indexOf('access_token=') !== -1) {
        var params = new URLSearchParams(hash.substring(1));
        var token = params.get('access_token');
        var type = params.get('type');
        if (token) {
          accessToken = token;
          localStorage.setItem('sb_access_token', token);
          window.history.replaceState(null, null, window.location.pathname);
          if (type === 'recovery') {
            showView('password');
          } else {
            showView('app');
          }
          return;
        }
      }
      showView(accessToken ? 'app' : 'auth');
    }

    initApp();
  </script>
</body>
</html>
