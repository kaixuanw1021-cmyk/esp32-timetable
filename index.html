<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 專屬課表管理</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 20px auto; padding: 0 15px; background: #f5f7fa; color: #333; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    h2 { margin-top: 0; font-size: 1.25rem; color: #10b981; }
    label { display: block; margin-top: 12px; font-weight: bold; font-size: 0.9rem; }
    .time-row { display: flex; gap: 10px; align-items: center; }
    .time-row input { flex: 1; }
    select, input, button { width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 1rem; }
    button { background: #10b981; color: white; border: none; font-weight: bold; margin-top: 14px; cursor: pointer; }
    button:hover { background: #059669; }
    .btn-passkey { background: #3b82f6; }
    .btn-passkey:hover { background: #2563eb; }
    .btn-outline { background: transparent; color: #555; border: 1px solid #ccc; margin-top: 8px; }
    .btn-outline:hover { background: #f0f0f0; }
    .item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    .del-btn { width: auto; background: #ef4444; padding: 5px 10px; margin: 0; font-size: 0.85rem; }
    .badge { background: #d1fae5; color: #065f46; padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; margin-right: 4px; }
    .hidden { display: none; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.85rem; color: #666; }
    .divider { text-align: center; margin: 14px 0 6px; font-size: 0.85rem; color: #888; }
  </style>
</head>
<body>

  <!-- 1. 登入與忘記密碼畫面（未登入時只顯示這張卡片） -->
  <div id="auth-section" class="card">
    <h2>🔐 課表管理系統登入</h2>
    <label>電子信箱 (Email)</label>
    <input type="email" id="email" placeholder="請輸入管理員信箱">
    <label>密碼</label>
    <input type="password" id="password" placeholder="請輸入密碼">
    
    <button onclick="loginWithPassword()">密碼登入</button>
    <button class="btn-outline" onclick="forgotPassword()">忘記密碼？寄送重設連結</button>

    <div class="divider">── 或使用生物辨識快速登入 ──</div>
    <button class="btn-passkey" onclick="loginWithPasskey()">🔑 使用通行金鑰 (Passkey) 登入</button>
  </div>

  <!-- 2. 設定新密碼畫面（點擊信箱重設連結或點「改密碼」時顯示） -->
  <div id="password-section" class="card hidden">
    <h2>🔑 設定新密碼</h2>
    <label>輸入新密碼 (至少 6 個字元)</label>
    <input type="password" id="new-password" placeholder="請輸入新密碼">
    <button onclick="updatePassword()">確認更新密碼</button>
    <button class="btn-outline" onclick="cancelPasswordChange()">取消返回</button>
  </div>

  <!-- 3. 登入成功後的課表管理主畫面 -->
  <div id="app-section" class="hidden">
    <div class="top-bar">
      <span id="user-email">已登入</span>
      <div>
        <a href="#" onclick="showChangePassword()" style="color:#3b82f6; margin-right:12px;">修改密碼</a>
        <a href="#" onclick="logout()" style="color:#ef4444;">登出</a>
      </div>
    </div>

    <div class="card">
      <h2>📅 新增 ESP32 課表</h2>
      <label>重複頻率 / 星期幾</label>
      <select id="day">
        <option value="7">🔁 每天重複 (Every Day)</option>
        <option value="8">💼 週一至週五 (Mon-Fri)</option>
        <option value="9">🏖️ 只有週末 (Sat-Sun)</option>
        <option value="1">星期一 (Mon)</option>
        <option value="2">星期二 (Tue)</option>
        <option value="3">星期三 (Wed)</option>
        <option value="4">星期四 (Thu)</option>
        <option value="5">星期五 (Fri)</option>
        <option value="6">星期六 (Sat)</option>
        <option value="0">星期日 (Sun)</option>
      </select>

      <label>上課時段 (幾點到幾點)</label>
      <div class="time-row">
        <input type="time" id="start_time" value="08:10">
        <span>～</span>
        <input type="time" id="end_time" value="09:00">
      </div>

      <label>科目或事項名稱 (英文)</label>
      <input type="text" id="subject" placeholder="例如: Math, English, Read">
      <button onclick="addClass()">＋ 新增到課表</button>
    </div>

    <div class="card">
      <h2>📋 目前雲端課表清單</h2>
      <div id="list">載入中...</div>
    </div>

    <div class="card">
      <h2>🛡️ 通行金鑰 (Passkey) 設定</h2>
      <p style="font-size:0.85rem; color:#666; margin-top:0;">將此手機或電腦的指紋 / Face ID 綁定為通行金鑰，下次免打密碼即可直接登入：</p>
      <button class="btn-passkey" onclick="registerPasskey()">＋ 在此裝置新增通行金鑰</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://supabase.co';
    const SUPABASE_KEY = '在這裡貼上你的_anon_public_key';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const dayNames = {
      0: '週日', 1: '週一', 2: '週二', 3: '週三', 4: '週四', 5: '週五', 6: '週六',
      7: '每天', 8: '週一至五', 9: '只有週末'
    };

    // 自動切換「登入畫面」、「重設密碼畫面」與「管理主畫面」
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('app-section').classList.add('hidden');
        document.getElementById('password-section').classList.remove('hidden');
      } else if (session) {
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('password-section').classList.add('hidden');
        document.getElementById('app-section').classList.remove('hidden');
        document.getElementById('user-email').innerText = session.user.email;
        loadClasses();
      } else {
        document.getElementById('auth-section').classList.remove('hidden');
        document.getElementById('app-section').classList.add('hidden');
        document.getElementById('password-section').classList.add('hidden');
      }
    });

    // 1. 帳號密碼登入
    async function loginWithPassword() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return alert('請輸入信箱與密碼！');
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) alert('登入失敗：' + error.message);
    }

    // 2. 忘記密碼（寄送重設連結到信箱）
    async function forgotPassword() {
      const email = document.getElementById('email').value.trim();
      if (!email) return alert('請先在上方輸入你的電子信箱，再點擊忘記密碼！');
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin
      });
      if (error) alert('寄送失敗：' + error.message);
      else alert('重設密碼信件已寄出！請打開信箱點擊連結，網頁會自動跳出設定新密碼畫面。');
    }

    // 3. 修改密碼
    function showChangePassword() {
      document.getElementById('app-section').classList.add('hidden');
      document.getElementById('password-section').classList.remove('hidden');
    }
    function cancelPasswordChange() {
      document.getElementById('password-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');
    }
    async function updatePassword() {
      const newPassword = document.getElementById('new-password').value;
      if (newPassword.length < 6) return alert('新密碼長度至少需要 6 個字元！');
      const { error } = await sb.auth.updateUser({ password: newPassword });
      if (error) alert('密碼更新失敗：' + error.message);
      else {
        alert('密碼已成功更新！');
        document.getElementById('new-password').value = '';
        cancelPasswordChange();
      }
    }

    // 4. 通行金鑰 (Passkey / WebAuthn) 建立與登入
    async function registerPasskey() {
      if (!window.PublicKeyCredential) {
        return alert('你目前的裝置或瀏覽器不支援通行金鑰 (Passkey)。');
      }
      try {
        const { data, error } = await sb.auth.mfa.enroll({
          factorType: 'webauthn',
          friendlyName: '我的裝置通行金鑰'
        });
        if (error) throw error;
        alert('通行金鑰 (Passkey) 已成功綁定到此裝置！下次可直接免密碼登入。');
      } catch (err) {
        alert('通行金鑰設定提示：' + err.message + '\n(請確認已在 Supabase 後台 Authentication -> Multi-Factor 開啟 WebAuthn)');
      }
    }

    async function loginWithPasskey() {
      const email = document.getElementById('email').value.trim();
      if (!email) return alert('請先在上方輸入你的電子信箱，再點選通行金鑰登入！');
      try {
        const { error } = await sb.auth.signInWithWebAuthn({ email });
        if (error) throw error;
      } catch (err) {
        alert('通行金鑰登入提示：' + err.message + '\n(若尚未綁定過，請先用密碼登入並在頁面最下方新增通行金鑰)');
      }
    }

    async function logout() {
      await sb.auth.signOut();
    }

    // 5. 課表讀取、新增與刪除
    async function loadClasses() {
      const listDiv = document.getElementById('list');
      const { data, error } = await sb.from('timetable').select('*').order('day_of_week', { ascending: false }).order('start_time', { ascending: true });
      if (error) { listDiv.innerText = '讀取失敗：' + error.message; return; }
      if (!data || data.length === 0) { listDiv.innerText = '目前還沒有任何課程。'; return; }

      listDiv.innerHTML = data.map(row => `
        <div class="item">
          <span>
            <span class="badge">${dayNames[row.day_of_week] || '自訂'}</span>
            <strong>${row.start_time}~${row.end_time || ''}</strong> ${row.subject}
          </span>
          <button class="del-btn" onclick="deleteClass(${row.id})">刪除</button>
        </div>
      `).join('');
    }

    async function addClass() {
      const day_of_week = parseInt(document.getElementById('day').value);
      const start_time = document.getElementById('start_time').value;
      const end_time = document.getElementById('end_time').value;
      const subject = document.getElementById('subject').value.trim();
      if (!start_time || !end_time || !subject) return alert('請完整填寫時間與科目！');
      if (start_time >= end_time) return alert('結束時間必須晚於開始時間！');

      const { error } = await sb.from('timetable').insert([{ day_of_week, start_time, end_time, subject }]);
      if (error) alert('新增失敗：' + error.message);
      else {
      document.getElementById('subject').value = '';
      loadClasses();
      }
    }
    async function deleteClass(id) {
    await sb.from('timetable').delete().eq('id', id);
    loadClasses();
    }
